services:
  # PetPlantr Backend
  petplantr-backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - ENABLE_PRODUCTION_AI=true
      - ENABLE_SYNTHETIC_MONITOR=true
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.production
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - petplantr-network
      - monitoring

  # NGINX Canary Proxy
  nginx-canary:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/local-canary.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - petplantr-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - petplantr-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - petplantr-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: petplantr-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.4.5
    container_name: petplantr-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards_monitoring:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  petplantr-network:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  redis_data:
  prometheus-data:
  grafana-data:
