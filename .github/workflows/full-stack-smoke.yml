name: Full Stack Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        env:
          HOST: 127.0.0.1
          PORT: 8080
          ENABLE_PRODUCTION_AI: 'false'
          ENABLE_BREED_API: 'false'
          CORS_ORIGINS: http://127.0.0.1:3000
        run: |
          nohup python api_server.py --host ${HOST} --port ${PORT} > server.log 2>&1 &
          echo $! > server.pid
          sleep 1

      - name: Wait for backend health
        run: |
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:8080/api/v1/health > /dev/null; then
              echo "Backend OK"; exit 0
            fi
            sleep 1
          done
          echo "Backend health failed"
          tail -n 200 server.log || true
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          PORT: 3000
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: |
          nohup npm run start > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid
          sleep 1

      - name: Hit app
        run: |
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Frontend OK"; exit 0
            fi
            sleep 1
          done
          echo "Full stack smoke failed"
          tail -n 200 frontend.log || true
          tail -n 200 server.log || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          [[ -f server.pid ]] && kill -9 "$(cat server.pid)" || true
          [[ -f frontend.pid ]] && kill -9 "$(cat frontend.pid)" || true
