name: Backend Smoke Test

on:
  push:
    branches: [ main, feat/* ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start API server
        env:
          HOST: 127.0.0.1
          PORT: 8080
          ENABLE_PRODUCTION_AI: 'false'
          ENABLE_BREED_API: 'false'
        run: |
          nohup python api_server.py --host ${HOST} --port ${PORT} > server.log 2>&1 &
          echo $! > server.pid
          sleep 1

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8080/api/v1/health > /dev/null; then
              echo "Health check OK"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          tail -n 200 server.log || true
          exit 1

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- server.log ---"
          tail -n 200 server.log || true

      - name: Stop server
        if: always()
        run: |
          if [[ -f server.pid ]]; then
            kill -9 "$(cat server.pid)" || true
          fi
