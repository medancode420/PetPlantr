name: Frontend Smoke Test

on:
  push:
    branches: [ main, feat/* ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start
        run: |
          PORT=3000 NODE_ENV=production nohup npm run start > frontend.log 2>&1 &
          echo $! > frontend.pid
          sleep 1

      - name: Health
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Frontend health OK"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend health failed"
          tail -n 200 frontend.log || true
          exit 1

      - name: Stop
        if: always()
        run: |
          if [[ -f frontend.pid ]]; then
            kill -9 "$(cat frontend.pid)" || true
          fi
