<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPlantr Production Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .status-good { color: #22c55e; }
        .status-warning { color: #f59e0b; }
        .status-error { color: #ef4444; }
        .loading { color: #6b7280; }
        pre {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px 10px 0;
        }
        button:hover { background: #2563eb; }
        .test-result {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid;
        }
        .test-result.success { 
            background: #f0fdf4; 
            border-color: #22c55e; 
        }
        .test-result.warning { 
            background: #fffbeb; 
            border-color: #f59e0b; 
        }
        .test-result.error { 
            background: #fef2f2; 
            border-color: #ef4444; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 PetPlantr Production Status</h1>
        <p>Verifying that the production deployment is using <strong>real AI models</strong> (not demo fallback).</p>
        
        <button onclick="runTests()">🔄 Run Tests</button>
        <button onclick="testQuickGeneration()">⚡ Quick Model Test</button>
        
        <div id="results"></div>
    </div>

    <script>
        const BASE_URL = 'https://petplantr.vercel.app';
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }
        
        async function testHealth() {
            try {
                log('📋 Testing health endpoint...', 'info');
                const response = await fetch(`${BASE_URL}/api/health`);
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Health check: PASSED<br>
                         Pipeline: <strong>${data.pipeline}</strong><br>
                         Version: ${data.version}<br>
                         Models: ${data.models?.join(', ')}`, 'success');
                    
                    if (data.pipeline === 'real') {
                        log('✅ Real AI models: CONFIRMED', 'success');
                    } else {
                        log('❌ Real AI models: NOT CONFIRMED', 'error');
                    }
                    
                    const env = data.environment || {};
                    if (env.hasReplicateToken) {
                        log('✅ Replicate API token: CONFIGURED', 'success');
                    } else {
                        log('❌ Replicate API token: MISSING', 'error');
                    }
                    
                    return true;
                } else {
                    log(`❌ Health check: FAILED (HTTP ${response.status})`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Health check: FAILED (${error.message})`, 'error');
                return false;
            }
        }
        
        async function testAPI() {
            try {
                log('🔧 Testing API environment...', 'info');
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                
                const response = await fetch(`${BASE_URL}/api/replicate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: 'test environment' }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (response.status === 503) {
                    log('⚠️ API returned 503: Environment variables not configured<br>→ Check Vercel dashboard for REPLICATE_API_TOKEN', 'warning');
                } else if (response.ok) {
                    const data = await response.json();
                    log('✅ API environment: CONFIGURED', 'success');
                    if (data.status === 'processing') {
                        log('✅ Real model generation: STARTED', 'success');
                    }
                } else {
                    log(`❌ API test: Unexpected status ${response.status}`, 'error');
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    log('⚠️ API timed out (may indicate old deployment hanging)', 'warning');
                } else {
                    log(`❌ API test: FAILED (${error.message})`, 'error');
                }
            }
        }
        
        async function testQuickGeneration() {
            document.getElementById('results').innerHTML = '';
            log('⚡ Testing quick model generation...', 'info');
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);
                
                const response = await fetch(`${BASE_URL}/api/replicate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: 'simple geometric pet planter, minimalist design' 
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await response.json();
                
                if (response.ok && data.status === 'processing') {
                    log(`✅ Model generation STARTED!<br>
                         Model: ${data.usedModel}<br>
                         Prediction ID: ${data.threeDPredictionId || data.predictionId}<br>
                         Status: ${data.status}`, 'success');
                    log('🎯 This confirms REAL AI models are working (not demo fallback)', 'success');
                } else {
                    log(`❌ Generation failed: ${JSON.stringify(data, null, 2)}`, 'error');
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    log('⚠️ Generation timed out', 'warning');
                } else {
                    log(`❌ Generation failed: ${error.message}`, 'error');
                }
            }
        }
        
        async function runTests() {
            document.getElementById('results').innerHTML = '';
            log('🚀 Starting production verification...', 'info');
            
            const healthOk = await testHealth();
            if (healthOk) {
                await testAPI();
            }
            
            log('✅ Verification complete!', 'success');
        }
        
        // Auto-run tests on page load
        setTimeout(runTests, 1000);
    </script>
</body>
</html>
