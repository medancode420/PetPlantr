<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 PetPlantr Debug Test</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.1/model-viewer.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .test-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }
        model-viewer {
            width: 100%;
            height: 300px;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }
        .loading { background: #fff3cd; color: #856404; }
        .loaded { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .console-log {
            background: #2d3748;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
        }
        .url-test {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 PetPlantr Debug & Fix Test</h1>
        
        <div class="url-test">
            <h3>🌐 URL Accessibility Test</h3>
            <button class="test-button" onclick="testUrl('http://localhost:3000/demo/dog-planter.glb')">Test Dog Planter GLB</button>
            <button class="test-button" onclick="testUrl('http://localhost:3000/demo/astronaut.glb')">Test Astronaut GLB</button>
            <button class="test-button" onclick="testUrl('http://localhost:3000/demo/sample-planter-large.glb')">Test Large Sample</button>
            <div id="urlResults" class="console-log" style="display: none;"></div>
        </div>

        <div class="test-grid">
            <!-- Test 1: Known Working Model (Astronaut) -->
            <div class="test-card">
                <h3>👨‍🚀 Astronaut (Known Working)</h3>
                <model-viewer 
                    id="astronaut"
                    src="http://localhost:3000/demo/astronaut.glb"
                    alt="Astronaut 3D Model"
                    auto-rotate 
                    camera-controls
                    loading="eager">
                </model-viewer>
                <div id="astronautStatus" class="status loading">⏳ Loading...</div>
                <div id="astronautLog" class="console-log" style="display: none;"></div>
            </div>

            <!-- Test 2: Our Generated Model -->
            <div class="test-card">
                <h3>🐕 Generated Dog Planter</h3>
                <model-viewer 
                    id="dogPlanter"
                    src="http://localhost:3000/demo/dog-planter.glb"
                    alt="Dog Planter 3D Model"
                    auto-rotate 
                    camera-controls
                    loading="eager">
                </model-viewer>
                <div id="dogPlanterStatus" class="status loading">⏳ Loading...</div>
                <div id="dogPlanterLog" class="console-log" style="display: none;"></div>
            </div>

            <!-- Test 3: Large Sample -->
            <div class="test-card">
                <h3>🚀 Large Sample (Known Working)</h3>
                <model-viewer 
                    id="largeSample"
                    src="http://localhost:3000/demo/sample-planter-large.glb"
                    alt="Large Sample 3D Model"
                    auto-rotate 
                    camera-controls
                    loading="eager">
                </model-viewer>
                <div id="largeSampleStatus" class="status loading">⏳ Loading...</div>
                <div id="largeSampleLog" class="console-log" style="display: none;"></div>
            </div>
        </div>

        <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
            <h3>📊 Debug Results</h3>
            <div id="debugSummary">Running tests...</div>
        </div>
    </div>

    <script>
        const models = ['astronaut', 'dogPlanter', 'largeSample'];
        const results = {};
        let logs = {};

        function log(modelId, message) {
            if (!logs[modelId]) logs[modelId] = [];
            logs[modelId].push(new Date().toLocaleTimeString() + ': ' + message);
            
            const logEl = document.getElementById(modelId + 'Log');
            logEl.style.display = 'block';
            logEl.innerHTML = logs[modelId].join('<br>');
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function testUrl(url) {
            const resultsEl = document.getElementById('urlResults');
            resultsEl.style.display = 'block';
            
            try {
                const response = await fetch(url, { method: 'HEAD' });
                const message = `✅ ${url} - Status: ${response.status}, Type: ${response.headers.get('content-type')}, Size: ${response.headers.get('content-length')} bytes`;
                resultsEl.innerHTML += message + '<br>';
            } catch (error) {
                const message = `❌ ${url} - Error: ${error.message}`;
                resultsEl.innerHTML += message + '<br>';
            }
        }

        models.forEach(modelId => {
            const modelViewer = document.getElementById(modelId);
            const statusDiv = document.getElementById(modelId + 'Status');

            log(modelId, 'Starting model load test...');
            log(modelId, 'Model URL: ' + modelViewer.src);

            modelViewer.addEventListener('load', () => {
                statusDiv.className = 'status loaded';
                statusDiv.innerHTML = '✅ Loaded successfully!';
                results[modelId] = 'success';
                log(modelId, '✅ Model loaded successfully!');
                updateSummary();
            });

            modelViewer.addEventListener('error', (event) => {
                statusDiv.className = 'status error';
                
                // Better error handling
                let errorMessage = 'Unknown error';
                if (event.detail) {
                    if (typeof event.detail === 'string') {
                        errorMessage = event.detail;
                    } else if (event.detail.message) {
                        errorMessage = event.detail.message;
                    } else if (event.detail.type) {
                        errorMessage = `Error type: ${event.detail.type}`;
                    } else {
                        errorMessage = JSON.stringify(event.detail);
                    }
                }
                
                statusDiv.innerHTML = `❌ Error: ${errorMessage}`;
                results[modelId] = 'error';
                log(modelId, `❌ Error occurred: ${errorMessage}`);
                log(modelId, `Full event: ${JSON.stringify(event.detail, null, 2)}`);
                updateSummary();
            });

            modelViewer.addEventListener('progress', (event) => {
                const progress = Math.round(event.detail.totalProgress * 100);
                if (progress < 100) {
                    statusDiv.innerHTML = `⏳ Loading... ${progress}%`;
                    log(modelId, `Loading progress: ${progress}%`);
                }
            });

            // Additional debug events
            modelViewer.addEventListener('model-visibility', (event) => {
                log(modelId, `Model visibility changed: ${event.detail.visible}`);
            });

            // Timeout check
            setTimeout(() => {
                if (!results[modelId]) {
                    statusDiv.className = 'status error';
                    statusDiv.innerHTML = '⏰ Timeout after 15s';
                    results[modelId] = 'timeout';
                    log(modelId, '⏰ Loading timeout after 15 seconds');
                    updateSummary();
                }
            }, 15000);
        });

        function updateSummary() {
            const completed = Object.keys(results).length;
            const successful = Object.values(results).filter(r => r === 'success').length;
            const failed = Object.values(results).filter(r => r !== 'success').length;

            let summary = `
                <p><strong>Progress:</strong> ${completed}/${models.length} models tested</p>
                <p><strong>✅ Successful:</strong> ${successful}</p>
                <p><strong>❌ Failed:</strong> ${failed}</p>
            `;

            if (completed === models.length) {
                if (successful > 0) {
                    summary += '<p><strong>✅ Some models are working - this confirms ModelViewer is functional!</strong></p>';
                    if (results.astronaut === 'success' && results.dogPlanter !== 'success') {
                        summary += '<p><strong>🔧 Issue: Our generated GLB needs fixing, but the system works with valid GLB files.</strong></p>';
                    }
                } else {
                    summary += '<p><strong>❌ All models failed - there may be a broader issue.</strong></p>';
                }
            }

            document.getElementById('debugSummary').innerHTML = summary;
        }

        // Auto-test URLs on load
        setTimeout(() => {
            testUrl('http://localhost:3000/demo/astronaut.glb');
            testUrl('http://localhost:3000/demo/dog-planter.glb');
        }, 1000);

        // Enhanced console logging
        const originalConsoleError = console.error;
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            
            // Try to identify which model caused the error
            const errorStr = args.join(' ');
            models.forEach(modelId => {
                const modelViewer = document.getElementById(modelId);
                if (errorStr.includes(modelViewer.src) || errorStr.includes('model-viewer')) {
                    log(modelId, `Console Error: ${errorStr}`);
                }
            });
        };
    </script>
</body>
</html>
