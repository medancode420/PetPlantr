version: '3.8'

services:
  petplantr:
    build: .
    container_name: petplantr-app
    ports:
      - "5000:5000"
    volumes:
      # Mount data directories for persistence
      - ./models:/app/models:ro
      - ./web_uploads:/app/web_uploads
      - ./web_output:/app/web_output
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - PETPLANTR_MODEL_PATH=/app/models
      - PETPLANTR_OUTPUT_PATH=/app/web_output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - petplantr-network

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: petplantr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - petplantr
    restart: unless-stopped
    networks:
      - petplantr-network
    profiles:
      - production

networks:
  petplantr-network:
    driver: bridge

volumes:
  petplantr-models:
  petplantr-uploads:
  petplantr-output:
