<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Viewer Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #viewer {
            width: 100%;
            height: 400px;
            background: #000;
            border-radius: 8px;
            position: relative;
        }
        
        .controls {
            margin: 10px 0;
            text-align: center;
        }
        
        button {
            margin: 5px;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .info {
            margin: 10px 0;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .logs {
            height: 150px;
            overflow-y: auto;
            background: #1a1a1a;
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐕 Pug Head Planter STL Viewer Test</h1>
        
        <div class="info">
            <div>Status: <span id="status">Initializing...</span></div>
            <div>File: simple_pug_planter.stl</div>
            <div>Expected: 79 triangles, 57 vertices</div>
        </div>
        
        <div id="viewer"></div>
        
        <div class="controls">
            <button onclick="toggleWireframe()">Toggle Wireframe</button>
            <button onclick="resetCamera()">Reset View</button>
            <button onclick="toggleRotation()">Toggle Rotation</button>
        </div>
        
        <div class="logs" id="logs"></div>
    </div>

    <script>
        let scene, camera, renderer, controls, mesh;
        let isWireframe = false;
        let autoRotate = true;
        
        function log(message) {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logs.innerHTML += `[${timestamp}] ${message}\n`;
            logs.scrollTop = logs.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
            log(`Status: ${status}`);
        }
        
        function init3DViewer() {
            updateStatus('Setting up 3D scene...');
            
            const container = document.getElementById('viewer');
            
            try {
                // Scene
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x202020);
                log('✅ Scene created');
                
                // Camera
                camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
                camera.position.set(5, 5, 5);
                log('✅ Camera positioned');
                
                // Renderer
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(container.offsetWidth, container.offsetHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(renderer.domElement);
                log('✅ Renderer initialized');
                
                // Controls
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.1;
                controls.autoRotate = autoRotate;
                controls.autoRotateSpeed = 2.0;
                log('✅ Orbit controls enabled');
                
                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                
                const fillLight = new THREE.DirectionalLight(0x4080ff, 0.3);
                fillLight.position.set(-10, -10, -5);
                scene.add(fillLight);
                log('✅ Lighting setup complete');
                
                // Load STL
                updateStatus('Loading STL file...');
                loadSTL();
                
                // Start animation loop
                animate();
                
            } catch (error) {
                log(`❌ Error initializing 3D viewer: ${error.message}`);
                updateStatus('Error during initialization');
            }
        }
        
        function loadSTL() {
            const loader = new THREE.STLLoader();
            
            loader.load(
                './sample-stl/simple_pug_planter.stl',
                function(geometry) {
                    log('✅ STL file loaded successfully');
                    updateStatus('Processing 3D geometry...');
                    
                    try {
                        // Compute normals and bounds
                        geometry.computeVertexNormals();
                        geometry.computeBoundingBox();
                        
                        log(`📐 Vertices: ${geometry.attributes.position.count}`);
                        log(`🔺 Faces: ${geometry.attributes.position.count / 3}`);
                        
                        // Create material
                        const material = new THREE.MeshPhongMaterial({
                            color: 0x48bb78,
                            shininess: 200,
                            specular: 0x222222
                        });
                        
                        // Create mesh
                        mesh = new THREE.Mesh(geometry, material);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        
                        // Center and scale
                        const center = geometry.boundingBox.getCenter(new THREE.Vector3());
                        mesh.position.sub(center);
                        
                        const size = geometry.boundingBox.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 4 / maxDim;
                        mesh.scale.setScalar(scale);
                        
                        scene.add(mesh);
                        
                        log('✅ Pug head planter model loaded and positioned');
                        updateStatus('Ready - 3D model loaded successfully!');
                        
                    } catch (error) {
                        log(`❌ Error processing geometry: ${error.message}`);
                        updateStatus('Error processing 3D model');
                    }
                },
                function(progress) {
                    if (progress.lengthComputable) {
                        const percent = (progress.loaded / progress.total * 100).toFixed(1);
                        updateStatus(`Loading... ${percent}%`);
                        log(`Loading progress: ${percent}%`);
                    }
                },
                function(error) {
                    log(`❌ Error loading STL: ${error.message || error}`);
                    updateStatus('Failed to load STL file');
                    console.error('STL loading error:', error);
                    
                    // Create fallback geometry
                    createFallbackModel();
                }
            );
        }
        
        function createFallbackModel() {
            log('🔄 Creating fallback model...');
            
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshPhongMaterial({ color: 0xff6b6b });
            
            mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            
            updateStatus('Fallback model loaded');
            log('✅ Fallback cube model created');
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function toggleWireframe() {
            if (mesh) {
                isWireframe = !isWireframe;
                mesh.material.wireframe = isWireframe;
                log(`Wireframe: ${isWireframe ? 'ON' : 'OFF'}`);
            }
        }
        
        function resetCamera() {
            if (controls) {
                controls.reset();
                log('Camera reset');
            }
        }
        
        function toggleRotation() {
            autoRotate = !autoRotate;
            if (controls) {
                controls.autoRotate = autoRotate;
                log(`Auto-rotation: ${autoRotate ? 'ON' : 'OFF'}`);
            }
        }
        
        // Handle window resize
        window.addEventListener('resize', function() {
            const container = document.getElementById('viewer');
            if (camera && renderer && container) {
                camera.aspect = container.offsetWidth / container.offsetHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.offsetWidth, container.offsetHeight);
            }
        });
        
        // Initialize when page loads
        window.addEventListener('load', function() {
            log('🚀 Page loaded, initializing 3D viewer...');
            init3DViewer();
        });
    </script>
</body>
</html>
