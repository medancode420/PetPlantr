server {
    listen 8080 default_server;
    server_name _;

    # quick self-check
    location = /__nginx-ok { default_type text/plain; return 200 "nginx-ok\n"; }

    client_max_body_size 20M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/websocket friendly
        proxy_set_header Connection        "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_buffering off;

        # timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://127.0.0.1:8000;
    }

    # optional: direct health aliases
    location = /api/health     { proxy_pass http://127.0.0.1:8000; access_log off; }
    location = /api/v1/health  { proxy_pass http://127.0.0.1:8000; access_log off; }
}