## Canary rollout for api.petplantr.com (10% v2, 90% v1)
## Drop this into your NGINX conf.d and ensure your main nginx.conf includes conf.d/*.conf

# Upstreams: adjust hosts/ports to match your deployment
upstream api_v1 {
    server 127.0.0.1:8000;
}

upstream api_v2 {
    # New canary instance
    server 127.0.0.1:8001;
}

# Deterministic 10% split using request_id (or use $remote_addr if request_id is unavailable)
split_clients "$request_id" $canary_bucket {
    10%    v2;
    *      v1;
}

# Map split to an upstream name
map $canary_bucket $api_upstream {
    default api_v1;
    v1      api_v1;
    v2      api_v2;
}

