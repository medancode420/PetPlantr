# Gitleaks configuration for PetPlantr
# Prevents accidental commit of secrets and sensitive data

title = "PetPlantr Security Scan"

[extend]
# Use the default gitleaks rules as a base
useDefault = true

# Additional custom rules for PetPlantr-specific secrets
[[rules]]
id = "stripe-secret-key"
description = "Stripe Secret Key"
regex = '''sk_live_[0-9a-zA-Z]{24}|sk_test_[0-9a-zA-Z]{24}'''
tags = ["payment", "stripe", "secret"]

[[rules]]
id = "stripe-publishable-key"
description = "Stripe Publishable Key"
regex = '''pk_live_[0-9a-zA-Z]{24}|pk_test_[0-9a-zA-Z]{24}'''
tags = ["payment", "stripe", "key"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[a-zA-Z0-9]{48}'''
tags = ["ai", "openai", "api-key"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "access-key"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''[0-9a-zA-Z/+]{40}'''
tags = ["aws", "secret-key"]

[[rules]]
id = "database-url"
description = "Database Connection String"
regex = '''postgres://.*:.*@.*:.*/.* || mysql://.*:.*@.*:.*/.* || mongodb://.*:.*@.*:.*/.*'''
tags = ["database", "connection-string"]

# Allowlist for false positives
[allowlist]
description = "Allowlisted files and patterns"
files = [
    '''\.env\.example$''',
    '''\.env\.template$''',
    '''README\.md$''',
    '''\.md$''',
    '''test_.*\.py$''',
    '''conftest\.py$'''
]

# Allowlist specific commits (if needed)
commits = []

# Paths to ignore completely
paths = [
    '''\.git/''',
    '''\.venv/''',
    '''node_modules/''',
    '''__pycache__/''',
    '''\.pytest_cache/''',
    '''htmlcov/''',
    '''\.coverage''',
    '''mutation-reports/'''
]

# Allowlist for test data
regexes = [
    '''test_token_123''',
    '''mock_api_key''',
    '''example_secret''',
    '''dummy_password''',
    '''test_database_url'''
]
