<!DOCTYPE html>
<html>
<head>
    <title>PetPlantr Ultimate Model Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        h1 { text-align: center; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #viewer { 
            width: 900px; 
            height: 700px; 
            margin: 20px auto; 
            border: 3px solid #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #000;
        }
        #status {
            text-align: center;
            color: white;
            margin: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            font-size: 18px;
        }
        .controls {
            text-align: center;
            margin: 20px;
        }
        button {
            padding: 12px 24px;
            margin: 5px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button:hover { background: #45a049; transform: translateY(-2px); }
    </style>
</head>
<body>
    <h1>🏆 PetPlantr Ultimate Golden Retriever Planter</h1>
    <div id="status">Loading the perfect dog planter...</div>
    
    <div class="controls">
        <button onclick="resetView()">Reset View</button>
        <button onclick="toggleRotation()">Toggle Rotation</button>
        <button onclick="toggleWireframe()">Toggle Wireframe</button>
    </div>
    
    <div id="viewer"></div>

    <script>
        let scene, camera, renderer, mesh;
        let autoRotate = true;
        let wireframe = false;
        
        function updateStatus(message) {
            document.getElementById('status').innerHTML = message;
        }
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2c3e50);
            
            // Camera
            const container = document.getElementById('viewer');
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // Lighting setup for premium look
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.position.set(50, 50, 50);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-50, 0, -50);
            scene.add(fillLight);
            
            const rimLight = new THREE.DirectionalLight(0x4a90e2, 0.5);
            rimLight.position.set(0, 50, -50);
            scene.add(rimLight);
            
            // Load the ultimate model
            loadUltimateModel();
            
            // Animation loop
            animate();
        }
        
        function loadUltimateModel() {
            updateStatus('🔄 Loading ultimate Golden Retriever planter...');
            
            const loader = new THREE.STLLoader();
            
            loader.load(
                'generated_models/ultimate_golden_retriever_UltimatePerfection_1751071484.stl',
                function(geometry) {
                    updateStatus('✅ Ultimate planter loaded successfully! Use mouse to rotate.');
                    
                    // Center the geometry
                    geometry.computeBoundingBox();
                    const center = geometry.boundingBox.getCenter(new THREE.Vector3());
                    geometry.translate(-center.x, -center.y, -center.z);
                    
                    // Create premium material
                    const material = new THREE.MeshPhongMaterial({
                        color: 0xD2B48C,  // Tan/ceramic color
                        shininess: 60,
                        specular: 0x222222,
                        transparent: false
                    });
                    
                    // Create mesh
                    mesh = new THREE.Mesh(geometry, material);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    
                    // Add to scene
                    scene.add(mesh);
                    
                    // Position camera for best view
                    const box = geometry.boundingBox;
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    camera.position.set(maxDim * 1.2, maxDim * 0.8, maxDim * 1.5);
                    camera.lookAt(0, 0, 0);
                    
                    console.log('Model loaded:', {
                        vertices: geometry.attributes.position.count,
                        faces: geometry.attributes.position.count / 3,
                        dimensions: size
                    });
                },
                function(progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    updateStatus(`⏳ Loading... ${percent}%`);
                },
                function(error) {
                    updateStatus('❌ Failed to load ultimate model. Loading fallback...');
                    console.error('Loading error:', error);
                    loadFallback();
                }
            );
        }
        
        function loadFallback() {
            // Create a simple dog-shaped fallback
            const group = new THREE.Group();
            
            // Head
            const headGeometry = new THREE.SphereGeometry(15, 16, 16);
            const headMaterial = new THREE.MeshPhongMaterial({ color: 0xD2B48C });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.set(0, 20, 10);
            head.scale.set(1, 0.8, 1.2);
            group.add(head);
            
            // Body
            const bodyGeometry = new THREE.SphereGeometry(18, 16, 16);
            const body = new THREE.Mesh(bodyGeometry, headMaterial);
            body.scale.set(1.2, 0.8, 1.5);
            group.add(body);
            
            // Ears
            for (let i = 0; i < 2; i++) {
                const earGeometry = new THREE.SphereGeometry(5, 8, 8);
                const ear = new THREE.Mesh(earGeometry, headMaterial);
                ear.position.set((i === 0 ? -1 : 1) * 12, 25, 8);
                ear.scale.set(0.6, 1.2, 0.4);
                group.add(ear);
            }
            
            mesh = group;
            scene.add(mesh);
            
            camera.position.set(60, 40, 80);
            camera.lookAt(0, 0, 0);
            
            updateStatus('📦 Fallback model loaded (simplified dog planter)');
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (mesh && autoRotate) {
                mesh.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        
        function resetView() {
            if (mesh) {
                const box = new THREE.Box3().setFromObject(mesh);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                camera.position.set(maxDim * 1.2, maxDim * 0.8, maxDim * 1.5);
                camera.lookAt(0, 0, 0);
                
                mesh.rotation.set(0, 0, 0);
            }
        }
        
        function toggleRotation() {
            autoRotate = !autoRotate;
            updateStatus(autoRotate ? '🔄 Auto-rotation ON' : '⏸️ Auto-rotation OFF');
        }
        
        function toggleWireframe() {
            if (mesh) {
                wireframe = !wireframe;
                if (mesh.material) {
                    mesh.material.wireframe = wireframe;
                } else if (mesh.children) {
                    mesh.children.forEach(child => {
                        if (child.material) child.material.wireframe = wireframe;
                    });
                }
                updateStatus(wireframe ? '🔗 Wireframe ON' : '🎨 Solid view ON');
            }
        }
        
        // Mouse controls
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        
        document.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'CANVAS') {
                mouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
                autoRotate = false;
            }
        });
        
        document.addEventListener('mouseup', () => {
            mouseDown = false;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (mouseDown && mesh) {
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                
                mesh.rotation.y += deltaX * 0.01;
                mesh.rotation.x += deltaY * 0.01;
                
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });
        
        // Zoom with mouse wheel
        document.addEventListener('wheel', (e) => {
            if (e.target.tagName === 'CANVAS') {
                const factor = e.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(factor);
                camera.lookAt(0, 0, 0);
                e.preventDefault();
            }
        });
        
        // Initialize when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
