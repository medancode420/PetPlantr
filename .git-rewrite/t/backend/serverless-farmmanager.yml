service: petplantr-farmmanager

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    STAGE: ${self:provider.stage}
    UPLOAD_BUCKET: ${env:UPLOAD_BUCKET, 'petplantr-uploads-dev'}
    RAW_STL_BUCKET: ${env:RAW_STL_BUCKET, 'petplantr-stl-raw-dev'}
    READY_STL_BUCKET: ${env:READY_STL_BUCKET, 'petplantr-stl-ready-dev'}
    EVENT_BUS_NAME: ${env:EVENT_BUS_NAME, 'petplantr-orderbus-dev'}
    ORDER_EVENT_BUS_NAME: ${env:ORDER_EVENT_BUS_NAME, 'petplantr-orderbus-dev'}
    FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:3000'}
    NEXT_PUBLIC_API_BASE_URL: ${env:NEXT_PUBLIC_API_BASE_URL, 'https://api.petplantr.com'}
    SLACK_WEBHOOK_URL: ${env:SLACK_WEBHOOK_URL, ''}
    SES_ENABLED: ${env:SES_ENABLED, 'false'}
    SENDER_EMAIL: ${env:SENDER_EMAIL, 'noreply@petplantr.com'}
    MOCK_CUSTOMER_EMAIL: ${env:MOCK_CUSTOMER_EMAIL, 'customer@example.com'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - events:PutEvents
      Resource: "*"

functions:
  farmManager:
    handler: dist/src/lambdas/farmManager.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /api/farm/status
          method: get
          cors: true
      - http:
          path: /api/farm/printers
          method: get
          cors: true
      - http:
          path: /api/farm/printers
          method: post
          cors: true
      - http:
          path: /api/farm/printers/{id}
          method: put
          cors: true
      - http:
          path: /api/farm/printers/{id}
          method: delete
          cors: true
      - http:
          path: /api/farm/jobs
          method: get
          cors: true
      - http:
          path: /api/farm/jobs
          method: post
          cors: true
      - http:
          path: /api/farm/jobs/{id}
          method: put
          cors: true
      - http:
          path: /api/farm/jobs/{id}
          method: delete
          cors: true
      - http:
          path: /api/farm/metrics
          method: get
          cors: true
      - http:
          path: /api/farm/analytics
          method: get
          cors: true
      - http:
          path: /api/farm/health
          method: get
          cors: true
      - http:
          path: /api/farm/insights
          method: get
          cors: true
      - http:
          path: /api/farm/predictions
          method: get
          cors: true
      - http:
          path: /api/farm/optimization
          method: get
          cors: true
      - http:
          path: /api/farm/frontend
          method: get
          cors: true
      - http:
          path: /api/farm/live
          method: get
          cors: true
      - http:
          path: /api/farm/realtime-stream
          method: get
          cors: true
      - http:
          path: /api/farm/assign
          method: post
          cors: true
      - http:
          path: /api/farm/complete
          method: post
          cors: true
    environment:
      PRINTERS_TABLE: petplantr-printers-${self:provider.stage}
      JOBS_TABLE: petplantr-jobs-${self:provider.stage}
      FARM_METRICS_TABLE: petplantr-metrics-${self:provider.stage}

resources:
  Resources:
    PrintersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: petplantr-printers-${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: printerId
            AttributeType: S
        KeySchema:
          - AttributeName: printerId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    JobsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: petplantr-jobs-${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: jobId
            AttributeType: S
        KeySchema:
          - AttributeName: jobId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    MetricsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: petplantr-metrics-${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: metricId
            AttributeType: S
        KeySchema:
          - AttributeName: metricId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

plugins:
  - serverless-offline
