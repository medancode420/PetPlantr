service: petplantr-pipeline

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  environment:
    STAGE: ${self:provider.stage}
    STRIPE_SECRET_KEY: ${ssm:/aws/reference/secretsmanager/petplantr/stripe/secret-key}
    STRIPE_WEBHOOK_SECRET: ${ssm:/aws/reference/secretsmanager/petplantr/stripe/webhook-secret}
    SLACK_WEBHOOK_URL: ${ssm:/aws/reference/secretsmanager/petplantr/slack/webhook-url}
    EVENT_BUS_NAME: !Ref OrderEventBus
  iam:
    role:
      statements:
        # EventBridge permissions for stripeWebhook only
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: !GetAtt OrderEventBus.Arn
        # S3 permissions for Lambda functions
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub "${UploadsBucket.Arn}/*"
            - !Sub "${RawStlBucket.Arn}/*"
            - !Sub "${ReadyStlBucket.Arn}/*"
        # Secrets Manager permissions
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - "arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:petplantr/*"

functions:
  createCheckout:
    handler: dist/src/lambdas/createCheckout.handler
    events:
      - http:
          path: /api/checkout
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/stripe/checkout
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:3000'}
      STRIPE_SECRET_KEY: ${ssm:/aws/reference/secretsmanager/petplantr/stripe/secret-key}
      STRIPE_PRICE_PET_PLANTER_BASIC: ${env:STRIPE_PRICE_PET_PLANTER_BASIC}
      STRIPE_PRICE_SMOKE_TEST: ${env:STRIPE_PRICE_SMOKE_TEST}
      SLACK_WEBHOOK_URL: ${ssm:/aws/reference/secretsmanager/petplantr/slack/webhook-url}

  stripeWebhook:
    handler: dist/src/lambdas/stripeWebhook.handler
    events:
      - http:
          path: /api/stripe/webhook
          method: post
          cors: true
    environment:
      EVENT_BUS_NAME: !Ref OrderEventBus
      STRIPE_WEBHOOK_SECRET: ${ssm:/aws/reference/secretsmanager/petplantr/stripe/webhook-secret}

  presignUpload:
    handler: dist/src/lambdas/presignUpload.handler
    role: !GetAtt UploadPhotoRole.Arn
    events:
      - http:
          path: /api/presign
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      UPLOAD_BUCKET: ${env:UPLOAD_BUCKET}-${self:provider.stage}
      REGION: ${self:provider.region}

  healthCheck:
    handler: dist/src/lambdas/healthCheck.handler
    events:
      - http:
          path: /api/healthz
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            methods:
              - GET
              - OPTIONS
      - http:
          path: /api/health
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            methods:
              - GET
              - OPTIONS
    environment:
      GIT_SHA: ${env:GIT_SHA, 'dev'}
      UNET_WEIGHTS: ${env:UNET_WEIGHTS, 'models/unet128_stage1_best.pth'}

  # Frontend-expected API endpoints
  uploadPhoto:
    handler: dist/src/lambdas/presignUpload.handler
    role: !GetAtt UploadPhotoRole.Arn
    events:
      - http:
          path: /api/upload
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      UPLOAD_BUCKET: ${env:UPLOAD_BUCKET}-${self:provider.stage}
      REGION: ${self:provider.region}

  analyzePet:
    handler: dist/src/lambdas/analyzePet.handler
    timeout: 60
    events:
      - http:
          path: /api/analyze-pet
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      REGION: ${self:provider.region}
      OPENAI_API_KEY: ${ssm:/aws/reference/secretsmanager/petplantr/openai/api-key}

  replicateAPI:
    handler: dist/src/lambdas/replicateAPI.handler
    timeout: 300
    events:
      - http:
          path: /api/replicate
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/replicate
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
    environment:
      REGION: ${self:provider.region}
      REPLICATE_API_TOKEN: ${ssm:/aws/reference/secretsmanager/petplantr/replicate/api-token}
      RAW_STL_BUCKET: ${env:RAW_STL_BUCKET}-${self:provider.stage}

  # Step Functions Lambda Functions
  downloadPhotos:
    handler: dist/src/lambdas/downloadPhotos.handler
    role: !GetAtt MeshProcessingRole.Arn
    timeout: 60
    environment:
      UPLOAD_BUCKET: ${env:UPLOAD_BUCKET}-${self:provider.stage}
      REGION: ${self:provider.region}

  generateSTL:
    handler: dist/src/lambdas/generateSTL.handler
    role: !GetAtt MeshProcessingRole.Arn
    timeout: 300
    environment:
      RAW_STL_BUCKET: ${env:RAW_STL_BUCKET}-${self:provider.stage}
      UNET_WEIGHTS: ${ssm:/aws/reference/secretsmanager/petplantr/prod/unet-weights}
      REGION: ${self:provider.region}

  processSTL:
    handler: dist/src/lambdas/processSTL.handler
    role: !GetAtt MeshProcessingRole.Arn
    timeout: 180
    environment:
      RAW_STL_BUCKET: ${env:RAW_STL_BUCKET}-${self:provider.stage}
      READY_STL_BUCKET: ${env:READY_STL_BUCKET}-${self:provider.stage}
      REGION: ${self:provider.region}

  notifyCustomer:
    handler: dist/src/lambdas/notifyCustomer.handler
    timeout: 30
    environment:
      SES_ENABLED: ${env:SES_ENABLED, 'false'}
      SENDER_EMAIL: ${env:SENDER_EMAIL, 'Daniel@PetPlantr.com'}
      FALLBACK_EMAIL: ${env:FALLBACK_EMAIL, 'noreply@petplantr.com'}
      MOCK_CUSTOMER_EMAIL: ${env:MOCK_CUSTOMER_EMAIL, 'customer@example.com'}
      SLACK_WEBHOOK_URL: ${ssm:/aws/reference/secretsmanager/petplantr/slack/webhook-url}
      MICROSOFT_GRAPH_ENABLED: ${env:MICROSOFT_GRAPH_ENABLED, 'true'}
      REGION: ${self:provider.region}

  handleError:
    handler: dist/src/lambdas/handleError.handler
    timeout: 30
    environment:
      SLACK_WEBHOOK_URL: ${ssm:/aws/reference/secretsmanager/petplantr/slack/webhook-url}
      MOCK_CUSTOMER_EMAIL: ${env:MOCK_CUSTOMER_EMAIL, 'customer@example.com'}
      MICROSOFT_GRAPH_ENABLED: ${env:MICROSOFT_GRAPH_ENABLED, 'true'}
      REGION: ${self:provider.region}

  notifyPrinter:
    handler: dist/src/lambdas/notifyPrinter.handler
    role: !GetAtt NotifyPrinterRole.Arn
    timeout: 30
    environment:
      PRINT_QUEUE_TOPIC_ARN: !Ref PrintQueueTopic
      REGION: ${self:provider.region}
      SLACK_WEBHOOK_URL: ${ssm:/aws/reference/secretsmanager/petplantr/slack/webhook-url}

  # AI/ML Modeling Pipeline Function
  modelingPipeline:
    handler: dist/src/lambdas/modelingPipeline.handler
    role: !GetAtt ModelingPipelineRole.Arn
    timeout: 900  # 15 minutes for GPU-intensive tasks
    memorySize: 3008  # Maximum memory for compute-intensive work
    environment:
      STAGE: ${self:provider.stage}
      UPLOAD_BUCKET: ${env:UPLOAD_BUCKET}-${self:provider.stage}
      RAW_STL_BUCKET: ${env:RAW_STL_BUCKET}-${self:provider.stage}
      READY_STL_BUCKET: ${env:READY_STL_BUCKET}-${self:provider.stage}
      PROCESSING_BUCKET: petplantr-processing-${self:provider.stage}
      MODELS_BUCKET: petplantr-models-prod
      REGION: ${self:provider.region}
      NODE_ENV: production

  # LangChain Upload Assistant
  chatUploadAssistant:
    handler: dist/src/lambdas/chatUploadAssistant.handler
    timeout: 30
    events:
      - http:
          path: /api/chat/upload
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      OPENAI_API_KEY: ${ssm:/aws/reference/secretsmanager/petplantr/openai/api-key}
      REGION: ${self:provider.region}

  # Continuous Learning Pipeline Functions
  fetchNewPhotos:
    handler: dist/src/lambdas/fetchNewPhotos.handler
    role: !GetAtt ContinuousLearningRole.Arn
    timeout: 300
    environment:
      TRAINING_BUCKET: petplantr-training-${self:provider.stage}
      STRIPE_SECRET_KEY: ${ssm:/aws/reference/secretsmanager/petplantr/stripe/secret-key}
      REGION: ${self:provider.region}

  updateManifest:
    handler: dist/src/lambdas/updateManifest.handler
    role: !GetAtt ContinuousLearningRole.Arn
    timeout: 60
    environment:
      TRAINING_BUCKET: petplantr-training-${self:provider.stage}
      REGION: ${self:provider.region}

  kickFineTuneJob:
    handler: dist/src/lambdas/kickFineTuneJob.handler
    role: !GetAtt ContinuousLearningRole.Arn
    timeout: 60
    environment:
      MODAL_TOKEN: ${ssm:/aws/reference/secretsmanager/petplantr/modal/token}
      TRAINING_BUCKET: petplantr-training-${self:provider.stage}
      MODELS_BUCKET: petplantr-models-${self:provider.stage}
      REGION: ${self:provider.region}

  evaluateMetrics:
    handler: dist/src/lambdas/evaluateMetrics.handler
    role: !GetAtt ContinuousLearningRole.Arn
    timeout: 60
    environment:
      MODELS_BUCKET: petplantr-models-${self:provider.stage}
      REGION: ${self:provider.region}

  canaryDeploy:
    handler: dist/src/lambdas/canaryDeploy.handler
    role: !GetAtt ContinuousLearningRole.Arn
    timeout: 300
    environment:
      MODELS_BUCKET: petplantr-models-${self:provider.stage}
      SLACK_WEBHOOK_URL: ${ssm:/aws/reference/secretsmanager/petplantr/slack/webhook-url}
      REGION: ${self:provider.region}

  trafficShift:
    handler: dist/src/lambdas/trafficShift.handler
    role: !GetAtt ContinuousLearningRole.Arn
    timeout: 300
    environment:
      MODELS_BUCKET: petplantr-models-${self:provider.stage}
      SLACK_WEBHOOK_URL: ${ssm:/aws/reference/secretsmanager/petplantr/slack/webhook-url}
      REGION: ${self:provider.region}

  # Multi-Printer Farm Management
  farmManager:
    handler: dist/src/lambdas/farmManager.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /api/farm/status
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/printers
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/printers
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/printers/{id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/printers/{id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/jobs
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/jobs
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/jobs/{id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/jobs/{id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/assign
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/complete
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/metrics
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/farm/optimization
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      PRINTERS_TABLE: !Ref PrintersTable
      JOBS_TABLE: !Ref PrintJobsTable
      FARM_METRICS_TABLE: !Ref FarmMetricsTable
      EVENT_BUS_NAME: !Ref OrderEventBus

    # Enhanced Order Processing
  enhancedOrderProcessor:
    handler: dist/src/lambdas/enhancedOrderProcessor.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /api/orders
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/orders
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/orders/{id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/orders/{id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/orders/complete-modeling
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/orders/update-status
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      ORDERS_TABLE: !Ref OrdersTable
      EVENT_BUS_NAME: !Ref OrderEventBus
      FARM_API_URL: !Sub "https://${self:service}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}/api/farm"

  # 🚀 Production-Ready Enhanced Order Processor V2
  enhancedOrderProcessorV2:
    handler: dist/src/lambdas/enhancedOrderProcessorV2.handler
    timeout: 30
    memorySize: 1024
    events:
      - http:
          path: /api/v2/orders
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/v2/orders
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/v2/orders/{id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/v2/orders/{id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/v2/orders/complete-modeling
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      ORDERS_TABLE: !Ref OrdersTable
      PRINTERS_TABLE: !Ref PrintersTable
      JOBS_TABLE: !Ref JobsTable
      ANALYTICS_TABLE: !Ref AnalyticsTable
      HIGH_PRIORITY_QUEUE_URL: !Ref HighPriorityQueue
      NORMAL_PRIORITY_QUEUE_URL: !Ref NormalPriorityQueue
      LOW_PRIORITY_QUEUE_URL: !Ref LowPriorityQueue
      DEAD_LETTER_QUEUE_URL: !Ref DeadLetterQueue
      NOTIFICATIONS_QUEUE_URL: !Ref NotificationsQueue
      ERROR_ALERTS_SNS_TOPIC: !Ref ErrorAlertsTopic
      JWT_SECRET: ${ssm:/aws/reference/secretsmanager/petplantr/jwt/secret}
      ENABLE_REDIS: 'false'
      LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
      RATE_LIMIT_MAX: ${env:RATE_LIMIT_MAX, '100'}
      MAX_LOGIN_ATTEMPTS: ${env:MAX_LOGIN_ATTEMPTS, '5'}
      EVENT_BUS_NAME: !Ref OrderEventBus

  # Real-Time Monitoring & Analytics
  realTimeMonitoring:
    handler: dist/src/lambdas/realTimeMonitoring.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /api/monitoring/dashboard
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/monitoring/metrics
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/monitoring/alerts
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/monitoring/alerts
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/monitoring/analytics
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/monitoring/health
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/monitoring/performance
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/monitoring/real-time
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      METRICS_TABLE: !Ref MetricsTable
      ALERTS_TABLE: !Ref AlertsTable

  # 🎨 Frontend Integration Service
  frontendIntegration:
    handler: dist/src/lambdas/frontendIntegration.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /api/frontend/dashboard
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/frontend/orders
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/frontend/printers
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/frontend/analytics
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
      - http:
          path: /api/frontend/notifications
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
    environment:
      ORDERS_TABLE: !Ref OrdersTable
      PRINTERS_TABLE: !Ref PrintersTable
      JOBS_TABLE: !Ref JobsTable
      ANALYTICS_TABLE: !Ref AnalyticsTable

resources:
  Resources:
    # S3 Buckets
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:UPLOAD_BUCKET}-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, POST, DELETE]
              AllowedOrigins: ['*']
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    RawStlBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: petplantr-stl-raw-${self:provider.stage}

    ReadyStlBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:READY_STL_BUCKET}-${self:provider.stage}
        LifecycleConfiguration:
          Rules:
            - Id: DeleteReadyStlAfter90Days
              Status: Enabled
              ExpirationInDays: 90
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    # Training Data Bucket for Continuous Learning
    TrainingBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: petplantr-training-${self:provider.stage}
        VersioningConfiguration:
          Status: Enabled
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    # Models Bucket for AI Model Storage
    ModelsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: petplantr-models-${self:provider.stage}
        VersioningConfiguration:
          Status: Enabled
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    # Step Functions State Machine
    ProcessOrderStateMachine:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: petplantr-process-order-${self:provider.stage}
        RoleArn: !GetAtt StepFunctionsRole.Arn
        DefinitionString: !Sub
          - ${definition}
          - definition: !Sub |
              {
                "Comment": "PetPlantr order pipeline",
                "StartAt": "ValidateOrder",
                "States": {
                  "ValidateOrder": {
                    "Type": "Pass",
                    "Comment": "Validate order data and user permissions",
                    "Parameters": {
                      "orderId.$": "$.orderId",
                      "userId.$": "$.userId",
                      "sku.$": "$.sku",
                      "sizeTier.$": "$.sizeTier",
                      "photoKeys.$": "$.photoKeys",
                      "sessionId.$": "$.sessionId",
                      "timestamp.$": "$.timestamp",
                      "status": "VALIDATED",
                      "validatedAt.$": "$$.State.EnteredTime"
                    },
                    "Next": "DownloadPhotos"
                  },
                  "DownloadPhotos": {
                    "Type": "Task",
                    "Comment": "Download user photos from S3 uploads bucket",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${DownloadPhotosLambdaFunction}",
                      "Payload": {
                        "orderId.$": "$.orderId",
                        "userId.$": "$.userId",
                        "photoKeys.$": "$.photoKeys",
                        "uploadBucket": "${env:UPLOAD_BUCKET}-${self:provider.stage}"
                      }
                    },
                    "Retry": [
                      {
                        "ErrorEquals": ["States.TaskFailed"],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 3,
                        "BackoffRate": 2.0
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "Next": "HandleError"
                      }
                    ],
                    "Next": "GenerateSTL"
                  },
                  "GenerateSTL": {
                    "Type": "Task",
                    "Comment": "Generate 3D STL mesh from photos using Shape-MVD",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${GenerateSTLLambdaFunction}",
                      "Payload": {
                        "orderId.$": "$.orderId",
                        "userId.$": "$.userId",
                        "photoKeys.$": "$.photoKeys",
                        "sizeTier.$": "$.sizeTier",
                        "rawStlBucket": "${env:RAW_STL_BUCKET}-${self:provider.stage}"
                      }
                    },
                    "TimeoutSeconds": 300,
                    "Retry": [
                      {
                        "ErrorEquals": ["States.TaskFailed"],
                        "IntervalSeconds": 10,
                        "MaxAttempts": 2,
                        "BackoffRate": 2.0
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "Next": "HandleError"
                      }
                    ],
                    "Next": "ProcessSTL"
                  },
                  "ProcessSTL": {
                    "Type": "Task",
                    "Comment": "Clean and validate STL mesh for 3D printing",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${ProcessSTLLambdaFunction}",
                      "Payload": {
                        "orderId.$": "$.orderId",
                        "userId.$": "$.userId",
                        "rawStlKey.$": "$.rawStlKey",
                        "sizeTier.$": "$.sizeTier",
                        "readyStlBucket": "${env:READY_STL_BUCKET}-${self:provider.stage}"
                      }
                    },
                    "TimeoutSeconds": 180,
                    "Retry": [
                      {
                        "ErrorEquals": ["States.TaskFailed"],
                        "IntervalSeconds": 5,
                        "MaxAttempts": 3,
                        "BackoffRate": 1.5
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "Next": "HandleError"
                      }
                    ],
                    "Next": "NotifyCustomer"
                  },
                  "NotifyCustomer": {
                    "Type": "Task",
                    "Comment": "Send completion notification to customer",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${NotifyCustomerLambdaFunction}",
                      "Payload": {
                        "orderId.$": "$.orderId",
                        "userId.$": "$.userId",
                        "readyStlKey.$": "$.readyStlKey",
                        "status": "COMPLETED"
                      }
                    },
                    "Retry": [
                      {
                        "ErrorEquals": ["States.TaskFailed"],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 2
                      }
                    ],
                    "End": true
                  },
                  "HandleError": {
                    "Type": "Task",
                    "Comment": "Handle processing errors and notify stakeholders",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${HandleErrorLambdaFunction}",
                      "Payload": {
                        "orderId.$": "$.orderId",
                        "userId.$": "$.userId",
                        "error.$": "$.Error",
                        "cause.$": "$.Cause",
                        "status": "FAILED"
                      }
                    },
                    "End": true
                  }
                }
              }

    # Continuous Learning Step Functions State Machine
    ModelFineTuneStateMachine:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: petplantr-model-finetune-${self:provider.stage}
        RoleArn: !GetAtt StepFunctionsRole.Arn
        DefinitionS3Location:
          Bucket: !Ref TrainingBucket
          Key: stepfunctions/modelFineTune.asl.json

    # Step Functions IAM Role
    StepFunctionsRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: states.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: StepFunctionsExecutionPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: '*'

    # EventBridge Event Bus
    OrderEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${env:EVENT_BUS_NAME}-${self:provider.stage}

    # EventBridge Rule to trigger Step Functions
    OrderPaidRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${env:EVENT_BUS_NAME}-${self:provider.stage}
        EventPattern:
          detail-type: ["ORDER_PAID"]
          source: ["petplantr.payments"]
        Targets:
          - Arn: !Ref ProcessOrderStateMachine
            Id: StartStateMachine
            RoleArn: !GetAtt EventBridgeToSFRole.Arn

    # EventBridge Rule for Continuous Learning Pipeline
    ConsentedOrderRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${env:EVENT_BUS_NAME}-${self:provider.stage}
        EventPattern:
          detail-type: ["ORDER_PAID"]
          source: ["petplantr.payments"]
          detail:
            consent: [true]
        Targets:
          - Arn: !Ref ModelFineTuneStateMachine
            Id: StartContinuousLearning
            RoleArn: !GetAtt EventBridgeToSFRole.Arn

    # EventBridge to Step Functions IAM Role
    EventBridgeToSFRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: StartSFExecution
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: states:StartExecution
                  Resource: !Ref ProcessOrderStateMachine

    # ─── CloudWatch Alarms ───────────────────────────
    LambdaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: PetPlantr-LambdaErrors-${self:provider.stage}
        AlarmDescription: Alert when any Lambda function errors
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    StepFunctionFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: PetPlantr-StepFunctionFailures-${self:provider.stage}
        AlarmDescription: Alert when Step Functions executions fail
        MetricName: ExecutionsFailed
        Namespace: AWS/States
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        Dimensions:
          - Name: StateMachineArn
            Value: !Ref ProcessOrderStateMachine
        AlarmActions:
          - !Ref AlertTopic

    WebhookFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: PetPlantr-WebhookFailures-${self:provider.stage}
        AlarmDescription: Alert when webhook Lambda has high error rate
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 2
        Threshold: 3
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        Dimensions:
          - Name: FunctionName
            Value: !Ref StripeWebhookLambdaFunction
        AlarmActions:
          - !Ref AlertTopic

    # Continuous Learning Pipeline Monitoring
    ModelFineTuneFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: "ModelFineTuneExecutionFailed-${self:provider.stage}"
        MetricName: ExecutionsFailed
        Namespace: "AWS/States"
        Dimensions:
          - Name: StateMachineArn
            Value: !Ref ModelFineTuneStateMachine
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        AlarmActions:
          - !Ref AlertTopic

    # Preview Thumbs Down Rate Alarm for Canary Monitoring
    PreviewThumbsDownAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: "PreviewThumbsDownHigh-${self:provider.stage}"
        MetricName: preview_thumbs_down_rate
        Namespace: "PetPlantr/CanaryMetrics"
        Statistic: Average
        Period: 86400  # 24 hours
        EvaluationPeriods: 1
        Threshold: 15
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    # ─── IAM Roles for S3 Access ────────────────────────
    UploadPhotoRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: PetPlantr-UploadPhotoRole-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: UploadPhotoBucketAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:PutObjectAcl
                  Resource: 
                    - !Sub "${UploadsBucket.Arn}/*"
                  Condition:
                    StringEquals:
                      's3:x-amz-acl': 'private'

    MeshProcessingRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: PetPlantr-MeshProcessingRole-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: MeshProcessingBucketAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: 
                    - !Sub "${UploadsBucket.Arn}/*"
                    - "arn:aws:s3:::petplantr-models/*"
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:PutObjectAcl
                  Resource: 
                    - !Sub "${RawStlBucket.Arn}/*"
                    - !Sub "${ReadyStlBucket.Arn}/*"

    # AI/ML Modeling Pipeline Role with GPU compute access
    ModelingPipelineRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: PetPlantr-ModelingPipelineRole-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: ModelingPipelineAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !Sub "${UploadsBucket.Arn}"
                    - !Sub "${UploadsBucket.Arn}/*"
                    - !Sub "arn:aws:s3:::petplantr-processing-${self:provider.stage}"
                    - !Sub "arn:aws:s3:::petplantr-processing-${self:provider.stage}/*"
                    - !Sub "arn:aws:s3:::petplantr-models-${self:provider.stage}"
                    - !Sub "arn:aws:s3:::petplantr-models-${self:provider.stage}/*"
                    - !Sub "arn:aws:s3:::petplantr-models-prod"
                    - !Sub "arn:aws:s3:::petplantr-models-prod/*"
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:PutObjectAcl
                    - s3:DeleteObject
                  Resource:
                    - !Sub "${RawStlBucket.Arn}/*"
                    - !Sub "${ReadyStlBucket.Arn}/*"
                    - !Sub "arn:aws:s3:::petplantr-processing-${self:provider.stage}/*"
                - Effect: Allow
                  Action:
                    - states:SendTaskSuccess
                    - states:SendTaskFailure
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - "arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:petplantr/models/*"

    # Continuous Learning Pipeline IAM Role
    ContinuousLearningRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: PetPlantr-ContinuousLearningRole-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: ContinuousLearningAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # S3 access for training data and models
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:ListBucket
                    - s3:DeleteObject
                  Resource:
                    - !Sub "${TrainingBucket.Arn}"
                    - !Sub "${TrainingBucket.Arn}/*"
                    - !Sub "${ModelsBucket.Arn}"
                    - !Sub "${ModelsBucket.Arn}/*"
                    - !Sub "${UploadsBucket.Arn}"
                    - !Sub "${UploadsBucket.Arn}/*"
                # CloudWatch alarms for canary monitoring
                - Effect: Allow
                  Action:
                    - cloudwatch:PutMetricAlarm
                    - cloudwatch:DeleteAlarms
                    - cloudwatch:DescribeAlarms
                    - cloudwatch:PutMetricData
                  Resource: "*"
                # Secrets Manager access
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - "arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:petplantr/*"
                # EventBridge for triggering fine-tune jobs
                - Effect: Allow
                  Action:
                    - events:PutEvents
                  Resource: !GetAtt OrderEventBus.Arn

    NotifyPrinterRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: PetPlantr-NotifyPrinterRole-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: NotifyPrinterAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sns:Publish
                  Resource: !Ref PrintQueueTopic
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - "arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:petplantr/*"

    StepFunctionsS3Role:
      Type: AWS::IAM::Role
      Properties:
        RoleName: PetPlantr-StepFunctionsS3Role-${self:provider.stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: states.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: StepFunctionsS3Access
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: 
                    - !Sub "${RawStlBucket.Arn}/*"
                    - !Sub "${ReadyStlBucket.Arn}/*"

    # ─── CloudWatch Alarms for Error Monitoring ────────────────────────
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: petplantr-alerts-${self:provider.stage}

    PrintQueueTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: petplantr-print-queue-${self:provider.stage}
        DisplayName: PetPlantr Print Queue Topic

    LambdaErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: "LambdaErrors-${self:provider.stage}"
        MetricName: Errors
        Namespace: "AWS/Lambda"
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        AlarmActions:
          - !Ref AlertTopic

    SfnFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: "PipelineExecutionFailed-${self:provider.stage}"
        MetricName: ExecutionsFailed
        Namespace: "AWS/States"
        Dimensions:
          - Name: StateMachineArn
            Value: !Ref ProcessOrderStateMachine
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        AlarmActions:
          - !Ref AlertTopic

  Outputs:
    AlertTopicArn:
      Description: ARN of the SNS topic for alerts
      Value: !Ref AlertTopic
      Export:
        Name: ${self:service}-${self:provider.stage}-alert-topic-arn

    PrintQueueTopicArn:
      Description: ARN of the SNS topic for print queue
      Value: !Ref PrintQueueTopic
      Export:
        Name: ${self:service}-${self:provider.stage}-print-queue-topic-arn

    ProcessOrderStateMachineArn:
      Description: ARN of the Step Functions state machine
      Value: !Ref ProcessOrderStateMachine
      Export:
        Name: ${self:service}-${self:provider.stage}-state-machine-arn

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
