
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Golden Retriever Production Planter - PetPlantr</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #viewer {
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin: 5px 5px 5px 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .control-button {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        .control-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .status-text {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="viewer"></div>
        
        <div id="info">
            <div class="title">🏭 Golden Retriever Production</div>
            <div class="subtitle">Production-Ready Dog Planter</div>
            <div class="badge">🎨 AI Generated</div>
            <div class="badge">🧊 3D Optimized</div>
            <div class="badge">🔧 Production Ready</div>
            <div class="badge">🖨️ Print Ready</div>
        </div>
        
        <div class="status">
            <div class="status-icon">🏆</div>
            <div class="status-text">PRODUCTION<br>QUALITY</div>
        </div>
        
        <div id="controls">
            <button class="control-button" onclick="resetView()">🔄 Reset View</button>
            <button class="control-button" onclick="toggleWireframe()">⚡ Wireframe</button>
            <button class="control-button" onclick="downloadSTL()">📥 Download STL</button>
            <button class="control-button" onclick="showSpecs()">📊 Specifications</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, mesh, controls;
        let wireframeMode = false;
        
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(200, 150, 200);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('viewer').appendChild(renderer.domElement);
            
            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.7);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(300, 300, 300);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const pointLight1 = new THREE.PointLight(0x4080ff, 0.5, 1000);
            pointLight1.position.set(-200, 200, 200);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xff8040, 0.3, 1000);
            pointLight2.position.set(200, -100, -200);
            scene.add(pointLight2);
            
            // Load STL
            const loader = new THREE.STLLoader();
            loader.load('production_Golden Retriever Production_1751069996_PRODUCTION_READY.stl', function(geometry) {
                geometry.computeVertexNormals();
                geometry.center();
                
                const material = new THREE.MeshPhongMaterial({
                    color: 0xD2691E,
                    shininess: 80,
                    specular: 0x444444
                });
                
                mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });
            
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(1000, 1000);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -150;
            ground.receiveShadow = true;
            scene.add(ground);
            
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        function resetView() {
            camera.position.set(200, 150, 200);
            controls.reset();
        }
        
        function toggleWireframe() {
            if (mesh) {
                wireframeMode = !wireframeMode;
                mesh.material.wireframe = wireframeMode;
            }
        }
        
        function downloadSTL() {
            window.open('production_Golden Retriever Production_1751069996_PRODUCTION_READY.stl', '_blank');
        }
        
        function showSpecs() {
            alert('Production Specifications:\n\n✅ Print Ready\n✅ Watertight Mesh\n✅ Optimized Geometry\n✅ Standard PLA Compatible\n\nRecommended Settings:\n• Layer Height: 0.2mm\n• Infill: 15%\n• Supports: Auto\n• Bed Temperature: 60°C');
        }
        
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        init();
    </script>
</body>
</html>
