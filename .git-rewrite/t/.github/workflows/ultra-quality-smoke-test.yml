name: Environment Validation & Ultra Quality Smoke Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  env-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Frontend env sanity check
      run: |
        # Ensure local dev environment points to correct API port
        if [ -f "frontend/.env.local" ]; then
          grep -q "NEXT_PUBLIC_API_BASE_URL=http://localhost:8000" frontend/.env.local || {
            echo "❌ ERROR: .env.local must point to localhost:8000"
            echo "Current config:"
            grep "NEXT_PUBLIC_API_BASE_URL" frontend/.env.local || echo "Missing API_BASE_URL"
            exit 1
          }
          echo "✅ Local dev environment correctly configured"
        fi
        
        # Verify staging environment exists and has correct URL
        if [ -f "frontend/.env.staging" ]; then
          grep -q "staging-api.petplantr.com" frontend/.env.staging || {
            echo "❌ ERROR: .env.staging must point to staging-api.petplantr.com"
            exit 1
          }
          echo "✅ Staging environment correctly configured"
        fi
        
        # Verify production environment exists and has correct URL
        if [ -f "frontend/.env.production" ]; then
          grep -q "api.petplantr.com" frontend/.env.production || {
            echo "❌ ERROR: .env.production must point to api.petplantr.com"
            exit 1
          }
          echo "✅ Production environment correctly configured"
        fi

  ultra-quality-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        pip install fastapi uvicorn pytest httpx
        pip install -r requirements.txt || echo "No requirements.txt found"
    
    - name: Start FastAPI server
      run: |
        FAST_MODE=true python3 api_server_minimal.py &
        API_PID=$!
        echo $API_PID > api_server.pid
        
        # Wait for server to start
        for i in {1..30}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "✅ API server started successfully"
            break
          fi
          sleep 1
        done
    
    - name: Test Ultra Quality endpoint
      run: |
        # Test that the ultra quality endpoint exists and responds
        response=$(curl -s -w "%{http_code}" -F "image_url=data:image/jpeg;base64,test" -F "quality_level=ultra" http://localhost:8000/api/v1/generate-enhanced-3d-simple)
        http_code="${response: -3}"
        
        if [ "$http_code" = "200" ]; then
          echo "✅ Ultra Quality endpoint responding correctly"
          # Check that response contains success field
          response_body="${response%???}"
          if echo "$response_body" | grep -q '"success"'; then
            echo "✅ Response contains success field"
          else
            echo "❌ Response missing success field: $response_body"
            exit 1
          fi
        else
          echo "❌ Ultra Quality endpoint failed with status: $http_code"
          echo "Response: ${response%???}"
          exit 1
        fi
    
    - name: Test health endpoint
      run: |
        response=$(curl -s http://localhost:8000/health)
        if echo "$response" | grep -q '"status":"healthy"'; then
          echo "✅ Health endpoint working correctly"
        else
          echo "❌ Health endpoint failed: $response"
          exit 1
        fi
    
    - name: Cleanup
      if: always()
      run: |
        if [ -f api_server.pid ]; then
          kill $(cat api_server.pid) || true
          rm api_server.pid
        fi
