name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  sprint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements-test-sprint-c.txt
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q -m sprint_c -c pytest.ini

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
    - run: |
      pip install -r requirements.txt
      if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run lint and typecheck (non-blocking)
        run: |
          chmod +x ./run-lint-typecheck.sh
          ./run-lint-typecheck.sh --no-fail -q || true

  config-tuner-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install linters
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Generate config tuning plan (dry-run)
        run: |
          python3 scripts/config-tuner.py --dry-run --plan-file config-tune-plan.yaml || true
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-tune-plan
          path: config-tune-plan.yaml

  ai-fixer:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run config-tuner to get issues (safe, top 5)
        run: |
          python scripts/config-tuner.py --json --max-files 5 --safe-mode . > issues.json || true
          test -s issues.json || echo '{"files":[],"pylint_overrides":{},"mypy_overrides":{},"warnings":["no issues"]}' > issues.json

      - name: Generate AI fix suggestions
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python scripts/ai_fixer.py --issues issues.json --output suggestions.md --top-n 5 || true
          if [ ! -f suggestions.md ]; then echo '# AI Suggested Fixes\n\nNo suggestions generated (missing API key or no issues found).' > suggestions.md; fi

      - name: Post suggestions to PR
        if: always()
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: suggestions.md
          comment_tag: ai-fixes
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
