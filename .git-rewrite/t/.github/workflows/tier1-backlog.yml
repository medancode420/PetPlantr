# Tier-1 Priority Backlog Automation Workflow
name: Generate Tier-1 Backlog Artifacts

on:
  push:
    paths: 
      - 'tier1_priority_backlog.ipynb'
      - '.github/workflows/tier1-backlog.yml'
  pull_request:
    paths:
      - 'tier1_priority_backlog.ipynb'
  workflow_dispatch:

jobs:
  generate-backlog-artifacts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jupyter pandas numpy matplotlib seaborn networkx plotly
        
    - name: Execute Tier-1 Backlog Notebook
      run: |
        mkdir -p reports scripts
        jupyter nbconvert --to notebook --execute tier1_priority_backlog.ipynb --output tier1_priority_backlog.ipynb
        
    - name: Verify artifacts generated
      run: |
        echo "📂 Generated artifacts:"
        ls -la reports/
        echo "🔧 Generated scripts:"
        ls -la scripts/seed_gh_issues.py || echo "No GitHub seeding script found"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: tier1-backlog-artifacts
        path: |
          reports/
          scripts/seed_gh_issues.py
          
    - name: Create summary comment (PR only)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          // Read the summary report if it exists
          let summary = "📊 **Tier-1 Priority Backlog Generated**\n\n";
          
          try {
            const reportPath = 'reports/tier1_backlog_report.json';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              summary += `- **Total Stories**: ${report.metadata.total_items}\n`;
              summary += `- **Total Story Points**: ${report.metadata.total_story_points}\n`;
              summary += `- **Estimated Sprints**: ${report.metadata.estimated_sprints}\n`;
              summary += `- **Fibonacci Compliance**: ${report.metadata.fibonacci_compliance}\n\n`;
              
              summary += "### Epic Breakdown:\n";
              for (const [epicId, epic] of Object.entries(report.epic_breakdown)) {
                summary += `- **${epicId}**: ${epic.story_count} stories, ${epic.total_story_points} SP\n`;
              }
              
              summary += "\n### Generated Artifacts:\n";
              for (const [name, path] of Object.entries(report.artifacts_generated)) {
                summary += `- ${name}: \`${path.split('/').pop()}\`\n`;
              }
            }
          } catch (error) {
            summary += "_Unable to read detailed report_\n";
          }
          
          summary += "\n🚀 **Next Steps**: Download artifacts and run `./scripts/seed_gh_issues.py` to create GitHub issues.";
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
