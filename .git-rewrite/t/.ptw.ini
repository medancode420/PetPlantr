# pytest-watch configuration for PetPlantr
# Test-on-save functionality for instant feedback

# Watch specific patterns
watch_patterns = [
    "*.py",
    "tests/**/*.py",
    "petplantr/**/*.py"
]

# Ignore patterns to avoid unnecessary re-runs
ignore_patterns = [
    "__pycache__",
    "*.pyc",
    ".git",
    ".venv",
    "node_modules",
    "htmlcov",
    ".coverage",
    "mutation-reports"
]

# Commands to run on file changes
test_command = "python -m pytest tests/ --tb=short -v --maxfail=3"
quick_test_command = "python -m pytest tests/test_critical_business_logic.py -v --tb=short"

# Performance test command
benchmark_command = "python -m pytest tests/test_performance_benchmarks.py --benchmark-only --benchmark-compare-fail=mean:10%"
