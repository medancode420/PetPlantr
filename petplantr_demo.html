<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPlantr - AI Pet Planter Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #4CAF50;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            background-color: #f9f9f9;
        }
        .upload-area.dragover {
            background-color: #e8f5e8;
            border-color: #66bb6a;
        }
        #fileInput {
            display: none;
        }
        .upload-btn {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background 0.3s;
        }
        .upload-btn:hover {
            background: #45a049;
        }
        .upload-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #preview {
            max-width: 300px;
            max-height: 300px;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 5px solid #4CAF50;
        }
        .result img {
            max-width: 100%;
            border-radius: 8px;
            margin: 10px 0;
        }
        .download-btn {
            background: #2196F3;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin: 10px 5px;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            border-left: 5px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 PetPlantr</h1>
        <p class="subtitle">Transform your pet's photo into a custom 3D planter using AI magic!</p>

        <form id="uploadForm">
            <div class="upload-area" id="uploadArea">
                <div id="uploadContent">
                    <h3>📸 Drop your pet's photo here</h3>
                    <p>or</p>
                    <label for="fileInput" class="upload-btn">Choose File</label>
                    <input type="file" id="fileInput" accept="image/*">
                    <p style="font-size: 14px; color: #666; margin-top: 10px;">
                        Supports: JPG, PNG, GIF (Max 10MB)
                    </p>
                </div>
            </div>
            <img id="preview" style="display: none;" alt="Preview">

            <div style="text-align: center; margin: 20px 0;">
                <button type="submit" class="upload-btn" id="submitBtn" disabled>
                    🚀 Generate Pet Planter
                </button>
            </div>
        </form>

        <div id="loading" class="loading" style="display: none;">
            🎨 AI is creating your custom planter design...<br>
            This may take 10-30 seconds...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="result" class="result" style="display: none;">
            <h3>🎉 Your Custom Pet Planter is Ready!</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const submitBtn = document.getElementById('submitBtn');
        const uploadArea = document.getElementById('uploadArea');
        const uploadContent = document.getElementById('uploadContent');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file.type.startsWith('image/')) {
                showError('Please select a valid image file');
                return;
            }

            if (file.size > 10 * 1024 * 1024) { // 10MB limit
                showError('File size must be less than 10MB');
                return;
            }

            fileInput.files = createFileList(file);
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            submitBtn.disabled = false;
            hideError();
        }

        function createFileList(file) {
            const dt = new DataTransfer();
            dt.items.add(file);
            return dt.files;
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!fileInput.files[0]) {
                showError('Please select a file first');
                return;
            }

            showLoading();
            hideError();

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('http://localhost:8000/upload-pet-photo/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                showResult(data);
            } catch (err) {
                showError('Failed to process image. Make sure the backend server is running.');
                console.error('Upload error:', err);
            } finally {
                hideLoading();
            }
        });

        function showLoading() {
            loading.style.display = 'block';
            submitBtn.disabled = true;
        }

        function hideLoading() {
            loading.style.display = 'none';
            submitBtn.disabled = false;
        }

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.style.display = 'block';
        }

        function hideError() {
            error.style.display = 'none';
        }

        function showResult(data) {
            resultContent.innerHTML = `
                <p><strong>🐕 Detected Breed:</strong> ${data.breed}</p>
                <h4>🪴 Planter Design Preview:</h4>
                <img src="${data.planter_image}" alt="Generated Planter" style="max-width: 100%; border-radius: 8px;">
                <br><br>
                <a href="${data.stl_url}" class="download-btn" download>📥 Download STL for 3D Printing</a>
                ${data.note ? `<p style="font-style: italic; color: #666; margin-top: 10px;">Note: ${data.note}</p>` : ''}
            `;
            result.style.display = 'block';
        }
    </script>
</body>
</html>
