# PetPlantr Local HTTPS Configuration
server {
    listen 443 ssl;
    server_name localhost petplantr.com;

    ssl_certificate /Users/medan/Downloads/PetPlantr/ssl/petplantr.com.crt;
    ssl_certificate_key /Users/medan/Downloads/PetPlantr/ssl/petplantr.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name localhost petplantr.com;
    return 301 https://$server_name$request_uri;
}
