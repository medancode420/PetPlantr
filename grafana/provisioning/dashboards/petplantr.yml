apiVersion: 1

providers:
  - name: 'petplantr-dashboards'
    orgId: 1
    folder: 'PetPlantr'
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards

  - name: 'petplantr-monitoring-dashboards'
    orgId: 1
    folder: 'Monitoring'
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards_monitoring
