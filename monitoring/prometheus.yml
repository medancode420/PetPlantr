global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'petplantr-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'system-monitor'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['host.docker.internal:9113']
