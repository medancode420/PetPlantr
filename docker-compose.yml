services:
  petplantr:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8000:8000"
      - "8443:8443"  # HTTPS port
    environment:
      - NODE_ENV=production
      - ENABLE_PRODUCTION_AI=true
      - ENABLE_SYNTHETIC_MONITOR=true
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Security environment variables
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - API_KEY=${API_KEY:-petplantr-api-key-12345}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    env_file:
      - .env.production
      - .env.security
    volumes:
      # Mount SSL certificates
      - ./security/ssl/certs:/app/security/ssl/certs:ro
      - ./security/ssl/private:/app/security/ssl/private:ro
      - ./security/ssl/dhparam.pem:/app/security/ssl/dhparam.pem:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      # Persist Redis data for rate limiting
      - redis_config:/etc/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"   # HTTP (redirect to HTTPS)
      - "443:443" # HTTPS
    volumes:
      - ./security/ssl/nginx_ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security/ssl/certs:/etc/ssl/certs:ro
      - ./security/ssl/private:/etc/ssl/private:ro
      - ./security/ssl/dhparam.pem:/etc/ssl/dhparam.pem:ro
    depends_on:
      - petplantr
    restart: unless-stopped

volumes:
  redis_data:
  redis_config:
